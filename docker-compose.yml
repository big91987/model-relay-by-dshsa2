services:
  gateway:
    build: .
    image: model-gateway:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

volumes:
  gateway-data:
